spring.application.name=document-platform-backend
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/document_platform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:document_platform}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.initialization-fail-timeout=-1
spring.sql.init.mode=never
spring.flyway.enabled=true
